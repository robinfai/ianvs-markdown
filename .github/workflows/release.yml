name: Linefold macOS release

on:
  push:
    tags: ['linefold-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linefold-release
  cancel-in-progress: false

jobs:
  release:
    # Manual runs must select an existing release tag, never a moving branch.
    if: startsWith(github.ref, 'refs/tags/linefold-v')
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
      COCOAPODS_DISABLE_STATS: 'true'
      SPARKLE_PUBLIC_KEY: ${{ vars.LINEFOLD_SPARKLE_PUBLIC_KEY }}
      UPDATE_FEED_TAG: linefold-v0.1.2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate version and signing configuration
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_PROFILE: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.LINEFOLD_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD MACOS_PROFILE SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          test "$GITHUB_REF_NAME" = "linefold-v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_OUTPUT=$GITHUB_WORKSPACE/dist" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-private.key" >> "$GITHUB_ENV"
          xcrun swift app/tool/update_keys.swift verify "$RUNNER_TEMP/sparkle-private.key" > /dev/null
          xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --output-format json > /dev/null
          test -f "app/releases/$version.md"
      - name: Fetch verified Sparkle tools
        run: |
          bash app/tool/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies and run app tests
        run: |
          make deps-integrations
          cd app
          flutter test --concurrency=2
      - name: Build release app
        working-directory: app
        run: |
          # Build with cloud support; the next step signs with the Developer ID
          # profile rather than asking Xcode for a development identity on CI.
          printf 'LINEFOLD_CLOUD_ENABLED = YES\nCODE_SIGNING_ALLOWED = NO\n' > macos/Runner/Configs/Signing.local.xcconfig
          FLUTTER_XCODE_ARCHS="arm64 x86_64" flutter build macos --release --target lib/main.dart
          python3 tool/macos_release.py configure build/macos/Build/Products/Release/Linefold.app \
            --public-key "$SPARKLE_PUBLIC_KEY" \
            --feed "https://github.com/$GITHUB_REPOSITORY/releases/download/$UPDATE_FEED_TAG/appcast.xml"
      - name: Import Developer ID certificate into temporary keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/linefold-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign app, frameworks, native libraries and Quick Look
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROFILE: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          export APPLE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/Linefold.provisionprofile"
          printf '%s' "$MACOS_PROFILE" | base64 --decode > "$APPLE_MACOS_PROVISIONING_PROFILE"
          python3 app/tool/sign_macos_release.py app/build/macos/Build/Products/Release/Linefold.app
          bash app/tool/verify_quicklook_bundle.sh
          python3 app/tool/check_document_export_entitlements.py --built-apps --build-mode Release
      - name: Notarize app and DMG; sign ZIP and update feed
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash app/tool/package_macos_release.sh
      - name: Save notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-result
          path: dist/notarization*.json
          if-no-files-found: ignore
      - name: Publish complete release and advance signed update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/tool/publish_macos_release.sh
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/linefold-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/Linefold.provisionprofile" "$RUNNER_TEMP/sparkle-private.key"
