name: Core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.0', '3.47.6']
    steps:
      - uses: actions/checkout@v6
      - name: Set up canonical formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - name: Preserve formatter path
        id: formatter
        run: echo "dart=$FLUTTER_ROOT/bin/dart" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: matrix.flutter != '3.44.0'
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Record SDK versions
        run: |
          flutter --version
          dart --version
          python3 --version
      - name: Install Flutter test runtime library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Core format, analysis and tests
        run: make check-core FORMAT_DART="${{ steps.formatter.outputs.dart }}"
      - name: Publication contents and external host
        run: make check-package
      - name: Save package and budget validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-check-${{ matrix.flutter }}
          path: |
            build/package-check/
            build/processing-budget/
          if-no-files-found: ignore

  app-features:
    name: App feature checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Flutter test runtime library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Resolve app dependencies
        run: cd app && flutter pub get
      - name: Check app formatting with actionable diff
        run: |
          dart format app/lib app/test
          git diff --exit-code -- app/lib app/test
      - name: Analyze app
        run: cd app && flutter analyze
      - name: Run writing workflow feature tests
        working-directory: app
        run: |
          tests=(test/workspace_palette_test.dart)
          for test in test/note_templates_test.dart test/slash_insertion_test.dart test/reference_dock_test.dart test/outline_operations_test.dart test/note_collections_test.dart; do
            if [ -f "$test" ]; then tests+=("$test"); fi
          done
          flutter test "${tests[@]}"

  required:
    name: Core required
    if: always()
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported SDK
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = success
