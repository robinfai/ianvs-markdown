name: Native integrations

on:
  pull_request:
    paths: &integration-paths
      - 'lib/**'
      - 'test/**'
      - 'example/**'
      - 'app/**'
      - 'packages/ianvs_mermaid/**'
      - 'packages/ianvs_markdown_clipboard/**'
      - 'demos/**'
      - 'pubspec.*'
      - 'analysis_options.yaml'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths: *integration-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: macOS regressions
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Record toolchains
        run: |
          flutter --version
          rustc --version
          xcodebuild -version
          sw_vers
      - name: Export fixture and snapshot regressions
        run: make deps-integrations test-document-export-fixture
      - name: Install pinned PDF content checker (CI only)
        run: |
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "PDF QA requires Python >=3.11"'
          python3 -m venv "$RUNNER_TEMP/linefold-export-qa"
          "$RUNNER_TEMP/linefold-export-qa/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r app/tool/requirements-export-qa.txt
          echo "PDF_QA_PYTHON=$RUNNER_TEMP/linefold-export-qa/bin/python" >> "$GITHUB_ENV"
      - name: Bounded HTML, Markdown and practical PDF acceptance
        run: make test-native-document-export
      # Publish the small export-only evidence before the unrelated builds. The
      # guard fails closed and includes logs/reports in the same byte budget.
      - name: Bound early export evidence
        id: export-evidence
        if: always()
        run: |
          python3 -m unittest discover -s app/tool -p test_check_export_evidence_budget.py
          python3 app/tool/check_export_evidence_budget.py app/build/export-qa
      - name: Save early export evidence
        if: ${{ always() && steps.export-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: document-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/export-qa/
          if-no-files-found: error
          retention-days: 7
      # A failed export acceptance must not hide the original host/build gates.
      # No step uses continue-on-error; every gate must pass for this job.
      - name: Host and remaining native regressions
        if: ${{ !cancelled() }}
        run: make check-integrations-rest
      - name: Save native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rendering
          path: |
            packages/ianvs_mermaid/build/visual-regression/
            app/build/export-qa/
          if-no-files-found: ignore

  # Build in an independent checkout: Flutter and Cargo generated files must
  # never be mutated concurrently by tests and builds in the same workspace.
  macos-builds:
    name: macOS builds
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Record toolchains
        run: |
          flutter --version
          rustc --version
          xcodebuild -version
          sw_vers
      - name: Build the example and app main entries
        if: ${{ !cancelled() }}
        run: make build-local build-local-release
      - name: Check sandbox PDF backend app declarations
        if: ${{ !cancelled() }}
        run: python3 app/tool/check_document_export_entitlements.py --built-apps

  # Preserve the existing required check name and reject failed, cancelled or
  # skipped dependencies. Both branches retain all of the previous macOS gates.
  macos:
    if: always()
    needs: [macos-tests, macos-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require macOS regressions and builds
        env:
          TEST_RESULT: ${{ needs.macos-tests.result }}
          BUILD_RESULT: ${{ needs.macos-builds.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Record simulator build toolchains and revision
        run: |
          git rev-parse HEAD
          flutter --version
          rustc --version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version
      # Compile the actual iOS entry and shared Apple bridge without a device,
      # signing identity, credentials, simulator boot, or release/upload step.
      - name: Build unsigned iOS reading preview
        run: make build-ios-preview
