name: Native integrations

on:
  pull_request:
    paths: &integration-paths
      - 'lib/**'
      - 'test/**'
      - 'example/**'
      - 'app/**'
      - 'packages/ianvs_mermaid/**'
      - 'packages/ianvs_markdown_clipboard/**'
      - 'demos/**'
      - 'pubspec.*'
      - 'analysis_options.yaml'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main, diag/p2-offline-pdf-system-fonts]
    paths: *integration-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Record toolchains
        run: |
          flutter --version
          rustc --version
          xcodebuild -version
          sw_vers
      - name: Export fixture and snapshot regressions
        run: make deps-integrations test-document-export-fixture
      - name: Bounded HTML and Markdown copy acceptance
        run: make test-native-document-export
      # A failed copy-export diagnostic must not hide the original host/build gates.
      # No step uses continue-on-error; every gate must pass for this job.
      - name: Host and remaining native regressions
        if: ${{ !cancelled() }}
        run: make check-integrations-rest
      - name: Build the example and app main entries
        if: ${{ !cancelled() }}
        run: make build-local build-local-release
      - name: Check copy-only sandbox app declarations
        if: ${{ !cancelled() }}
        run: python3 app/tool/check_document_export_entitlements.py --built-apps
      - name: Save native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rendering
          path: |
            packages/ianvs_mermaid/build/visual-regression/
            app/build/export-qa/
          if-no-files-found: ignore

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Record simulator build toolchains and revision
        run: |
          git rev-parse HEAD
          flutter --version
          rustc --version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version
      # Compile the actual iOS entry and shared Apple bridge without a device,
      # signing identity, credentials, simulator boot, or release/upload step.
      - name: Build unsigned iOS reading preview
        run: make build-ios-preview

  pdf-font-diagnostic:
    name: Synthetic PDF font diagnostic (not product acceptance)
    if: ${{ github.ref == 'refs/heads/diag/p2-offline-pdf-system-fonts' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Bounded installed-system-font matrix
        id: font_diagnostic
        run: make test-native-pdf-font-diagnostic
      - name: Save strict Unicode results and actual PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-font-diagnostic
          path: ${{ steps.font_diagnostic.outputs.evidence-path }}
          if-no-files-found: error
