name: ianvs_markdown_app
description: A file-first desktop Markdown editor built with ianvs_markdown.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  ianvs_markdown:
    path: ../
  path: ^1.9.1
