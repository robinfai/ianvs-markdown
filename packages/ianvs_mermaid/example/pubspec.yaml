name: ianvs_mermaid_example
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  ianvs_mermaid:
    path: ../
  ianvs_markdown:
    path: ../../../
  ianvs_markdown_clipboard:
    path: ../../ianvs_markdown_clipboard

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

# Native Assets hooks 2.2 require newer annotations than Flutter 3.44 pins.
dependency_overrides:
  meta: 1.19.0
